name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e "./mcp-server[dev]" -e "./agent[dev]"
      - run: ruff check agent mcp-server scripts
      - run: pytest mcp-server/tests agent/tests -q

  web:
    runs-on: ubuntu-latest
    # web/ does not exist until stage 6
    if: ${{ hashFiles('web/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          LIVEKIT_URL: wss://example.livekit.cloud
          LIVEKIT_API_KEY: ci
          LIVEKIT_API_SECRET: ci
