name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e "./mcp-server[dev]" -e "./agent[dev]"
      - run: ruff check .
      - run: pytest mcp-server/tests agent/tests -q

  # The web/ job is added in stage 6, when web/ exists. A job guarded on
  # hashFiles('web/package.json') does not work: hashFiles is unavailable in a
  # job-level `if`, and the whole workflow fails to parse.
