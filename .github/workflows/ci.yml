name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # setup-uv already creates .venv and exports VIRTUAL_ENV; --system would hit
      # the runner's externally managed Python, and `uv venv` would hit the existing one.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install -e "./mcp-server[dev]" -e "./agent[dev]"
      - run: ruff check .
      - run: pytest mcp-server/tests agent/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      # The build needs these present, not valid: the token route reads them at
      # request time, and nothing here makes a request.
      - run: npm run build
        working-directory: web
        env:
          LIVEKIT_URL: wss://example.livekit.cloud
          LIVEKIT_API_KEY: ci
          LIVEKIT_API_SECRET: ci
