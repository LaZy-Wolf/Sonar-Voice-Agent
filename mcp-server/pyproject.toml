[project]
name = "sonar-tools"
version = "0.1.0"
description = "SONAR MCP tool server — Helios Solar front-desk tools over SQLite"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.10",
    "rank-bm25>=0.2",
    "faker>=30",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sonar_tools"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
